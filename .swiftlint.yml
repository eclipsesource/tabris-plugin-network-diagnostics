included:
  - Sources
  - Tests
  - src/ios

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - example

attributes:
  attributes_with_arguments_always_on_line_above: false
  always_on_same_line:
    - "@Test"
    - "@Suite"

opt_in_rules:
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discarded_notification_center_observer
  - discouraged_assert
  - empty_count
  - empty_string
  - enum_case_associated_values_count
#  - explicit_acl
#  - explicit_top_level_acl
  - explicit_init
  - fallthrough
  - fatal_error_message
#  - file_header
#  - file_name
  - file_name_no_space
#  - file_types_order
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - indentation_width
  - joined_default_parameter
  - last_where
  - legacy_objc_type
  - let_var_whitespace
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
#  - no_magic_numbers
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_interface_builder
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - test_case_accessibility
  - toggle_bool
  - trailing_closure
#  - type_contents_order
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition
  - balanced_xctest_lifecycle
  - empty_xctest_method

nesting:
  type_level: 2

# Google Swift Style Guide requires trailing commas in vertical literals
trailing_comma:
  mandatory_comma: true

# Only rewrite to trailing-closure syntax when the closure is the sole
# closure parameter — rewriting calls to functions with several closure
# parameters silently rebinds the closure to the last one
trailing_closure:
  only_single_muted_parameter: true

force_try:
  severity: error

analyzer_rules:
  - capture_variable
  - unused_declaration
  - unused_import

custom_rules:
  # Production code carries no comments; `swiftlint:` directives are linter
  # configuration, not narration, and stay. Matching on comment syntax kinds
  # keeps a double slash inside a string literal from being flagged.
  no_comments:
    name: "No Comments"
    regex: '(//|/\*)(?!\s*swiftlint:)'
    match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
    excluded:
      - ".*Tests/.*"
      - ".*Package\\.swift"
    message: "Comments are not used in production code — express intent in names, record rationale in docs/decisions/"
    severity: error
